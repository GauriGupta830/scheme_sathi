<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheme Saathi — Government Scheme Eligibility Assistant</title>
<meta name="description" content="AI assistant that matches citizens to eligible government schemes with transparent reasoning.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23174a9f' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23174a9f'/%3E%3Cg stroke='%23174a9f' stroke-width='4' stroke-linecap='round'%3E%3Cline x1='50' y1='12' x2='50' y2='88'/%3E%3Cline x1='12' y1='50' x2='88' y2='50'/%3E%3Cline x1='23' y1='23' x2='77' y2='77'/%3E%3Cline x1='23' y1='77' x2='77' y2='23'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css?v=7">
</head>
<body>
<div class="layout">

  <!-- ============================= SIDEBAR ============================= -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="s-brand">
      <svg class="chakra" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#tg)" stroke-width="5"/>
        <circle cx="50" cy="50" r="7" fill="#174a9f"/>
        <g stroke="#174a9f" stroke-width="4" stroke-linecap="round">
          <line x1="50" y1="12" x2="50" y2="88"/><line x1="12" y1="50" x2="88" y2="50"/>
          <line x1="23" y1="23" x2="77" y2="77"/><line x1="23" y1="77" x2="77" y2="23"/>
          <line x1="36" y1="15" x2="64" y2="85"/><line x1="15" y1="36" x2="85" y2="64"/>
          <line x1="64" y1="15" x2="36" y2="85"/><line x1="15" y1="64" x2="85" y2="36"/>
        </g>
        <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e2680f"/><stop offset=".5" stop-color="#e3e8f2"/><stop offset="1" stop-color="#167d4f"/>
        </linearGradient></defs>
      </svg>
      <div class="s-brand-t">
        <div class="brand-name">Scheme Saathi</div>
        <div class="brand-sub">स्कीम साथी · Eligibility Assistant</div>
      </div>
    </div>

    <nav class="s-nav" aria-label="Main navigation">
      <button class="s-nav-item active" data-view="chat">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="s-label" data-i18n="navChat">Assistant</span>
      </button>
      <button class="s-nav-item" data-view="report" id="nav-report" disabled>
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H5a2 2 0 0 0-2 2v7h6v-9zM15 3H9v17h6V3zM21 7h-4a2 2 0 0 0-2 2v11h6V9a2 2 0 0 0-2-2z"/></svg></span>
        <span class="s-label" data-i18n="navReport">Eligibility Report</span>
        <span class="s-count" id="report-count" hidden>0</span>
      </button>
      <button class="s-nav-item" data-view="schemes">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>
        <span class="s-label" data-i18n="navSchemes">Scheme Library</span>
        <span class="s-count soft" id="scheme-count">25</span>
      </button>
    </nav>

    <div class="s-themes">
      <button class="s-nav-item s-themes-btn" id="themes-btn" aria-expanded="false" aria-controls="themes-panel">
        <span class="s-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.65-.75 1.65-1.65 0-.44-.18-.84-.47-1.13-.29-.29-.47-.68-.47-1.12a1.65 1.65 0 0 1 1.65-1.65h1.95A5.71 5.71 0 0 0 22 12c0-5.5-4.5-10-10-10z"/></svg></span>
        <span class="s-label" data-i18n="themes">Themes</span>
        <span class="s-caret">▾</span>
      </button>
      <div class="themes-panel" id="themes-panel" hidden>
        <div class="themes-title" data-i18n="themesTitle">Choose a theme</div>
        <button type="button" class="theme-opt active" data-theme="light">
          <span class="theme-dot" style="background: linear-gradient(135deg, #174a9f 50%, #e2680f 50%)"></span>
          <span class="theme-name" data-i18n="themeLight">Gov Light (default)</span><span class="theme-check">✓</span>
        </button>
        <button type="button" class="theme-opt" data-theme="midnight">
          <span class="theme-dot" style="background: linear-gradient(135deg, #0d1420 50%, #5c8ef2 50%)"></span>
          <span class="theme-name" data-i18n="themeMidnight">Midnight 🌙</span><span class="theme-check">✓</span>
        </button>
        <button type="button" class="theme-opt" data-theme="kesari">
          <span class="theme-dot" style="background: linear-gradient(135deg, #fdf4ea 50%, #c2520a 50%)"></span>
          <span class="theme-name" data-i18n="themeKesari">Kesari 🧡</span><span class="theme-check">✓</span>
        </button>
        <button type="button" class="theme-opt" data-theme="emerald">
          <span class="theme-dot" style="background: linear-gradient(135deg, #eef6f1 50%, #0f7a4d 50%)"></span>
          <span class="theme-name" data-i18n="themeEmerald">Emerald 🌿</span><span class="theme-check">✓</span>
        </button>
        <button type="button" class="theme-opt" data-theme="royal">
          <span class="theme-dot" style="background: linear-gradient(135deg, #f5f2fb 50%, #6c3fc4 50%)"></span>
          <span class="theme-name" data-i18n="themeRoyal">Royal 💜</span><span class="theme-check">✓</span>
        </button>
      </div>
    </div>

    <div class="s-profile">
      <div class="s-sec"><span data-i18n="profileTitle">Your profile</span><span class="s-pct" id="profile-pct"></span></div>
      <div class="s-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="s-progress-fill"></span></div>
      <dl class="s-rows" id="profile-rows"></dl>
      <p class="s-hint" id="profile-hint" data-i18n="profileHint">Answers appear here in real time as you chat.</p>
    </div>

    <div class="s-foot">
      <button class="btn btn-outline wfull" id="restart-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span data-i18n="newSession">New session</span>
      </button>
      <div class="s-privacy">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span data-i18n="privacy">In-memory session — nothing is stored</span>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay" hidden></div>

  <!-- ============================= MAIN ============================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamb" id="hamb" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="tb-titles">
        <h2 id="view-title">Assistant</h2>
        <p id="view-sub">Answer a few questions — get your scheme eligibility instantly</p>
      </div>
      <div class="tb-actions">
        <div class="status-pill"><span class="dot" aria-hidden="true"></span><span>LangGraph · <b id="engine-badge">rule-engine</b></span></div>
        <div class="seg" id="lang-seg" role="tablist" aria-label="Language">
          <button class="seg-btn active" data-lang="en">EN</button>
          <button class="seg-btn" data-lang="hi">हिंदी</button>
          <span class="seg-pill" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- ================= CHAT VIEW ================= -->
      <section class="view active" id="view-chat">
        <div class="chat-wrap">
          <div class="chat-scroll" id="chat-scroll" aria-live="polite"></div>
          <div class="options-panel" id="options-panel" hidden>
            <div class="opt-title" id="opt-title">Choose an option or type below</div>
            <div class="opt-grid" id="opt-grid"></div>
          </div>
          <form class="composer" id="composer" autocomplete="off">
            <button type="button" class="icon-btn composer-mic" id="mic-btn" title="Voice input" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <input id="msg-input" placeholder="Type your answer…" aria-label="Type your answer">
            <button type="submit" class="send-btn" id="send-btn" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
        </div>
      </section>

      <!-- ================= REPORT VIEW ================= -->
      <section class="view" id="view-report">
        <div class="report-wrap" id="report-root"></div>
      </section>

      <!-- ================= SCHEMES VIEW ================= -->
      <section class="view" id="view-schemes">
        <div class="lib-wrap">
          <div class="lib-toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="scheme-search" placeholder="Search schemes, ministries, benefits…">
            </div>
            <div class="lib-pills" id="lib-pills"></div>
          </div>
          <div class="lib-grid" id="lib-grid"></div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="/static/app.js?v=7"></script>
  <canvas id="confetti-canvas" hidden></canvas>
</body>
</html>
